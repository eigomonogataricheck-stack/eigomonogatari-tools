<!DOCTYPE html>

<html lang="ja"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>英語物語 対戦ツール</title><link href="style.css?v=20260821-35" rel="stylesheet"/><meta content="20260821-35" name="eigo-ui-build"/><style id="eigo-layout-v35">
.calculator-title{display:grid!important;grid-template-columns:1fr auto 1fr;align-items:center!important;gap:10px}.calculator-title h1{justify-self:start}.calculator-title .swap{justify-self:center;margin:0}.calculator-title .reset-btn{justify-self:end}
.calculator-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}.calculator-layout .result{position:sticky;top:70px;min-width:0;padding:22px 14px}.calculator-layout .result strong{margin:10px 0}.calculator-layout .result #damageRange{overflow-wrap:anywhere}
.fields label,.progressive-fields label,.tier-controls label{font-weight:400!important}
.character-select-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:stretch;margin-bottom:2px}.character-select-row .pick{min-width:0}.character-select-row .pick small{white-space:normal;overflow-wrap:anywhere}.character-select-row .skill-toggle{min-width:92px;margin-left:2px;padding:8px 11px;border:1px solid #999;border-radius:7px;background:#fff;font-weight:700}.character-select-row .skill-toggle.active{background:#e8f5ee;color:#157347}
.skill.readonly-skill{display:grid;gap:4px;margin-top:12px;padding:0;border:0;background:transparent}.skill.readonly-skill>div{display:grid;gap:4px}.skill.readonly-skill b{color:#60656b;font-size:.74rem;font-weight:400}.skill.readonly-skill p{display:none}.skill.readonly-skill small{display:block;min-height:44px;padding:11px 10px;border:1px solid #bbb;border-radius:7px;background:#f7fbf8;color:#137333;font-size:.82rem;line-height:1.4}.skill[hidden]{display:none!important}
.preview-modal{width:min(1500px,98vw)!important;max-height:96vh!important;padding:64px 24px 24px!important}.preview-modal>h2{font-size:1.55rem!important}.preview-modal>img{width:100%!important;max-height:none!important}.preview-actions button{font-size:1.05rem!important}
@media(max-width:800px){.calculator-title{grid-template-columns:minmax(0,1fr) auto auto!important;align-items:center!important;gap:6px}.calculator-title h1{grid-column:1;grid-row:1;font-size:1.15rem;white-space:nowrap}.calculator-title .swap{grid-column:2;grid-row:1;justify-self:center;margin:0;padding:6px 8px;font-size:.72rem;white-space:nowrap}.calculator-title .reset-btn{grid-column:3;grid-row:1;justify-self:end;white-space:nowrap}.calculator-layout{display:grid;grid-template-columns:1fr;gap:18px}.calculator-layout .result{position:static;top:auto}.battle{gap:18px!important}.fighter-actions{flex-direction:row!important;flex-wrap:nowrap}.mini-reset{min-height:38px;flex:1;font-size:.72rem!important;padding:7px 8px!important;white-space:nowrap}.fields input,.fields select,.progressive-fields input,.tier-controls select,.toolbar input,.picker-modal>input{font-size:16px!important}.character-select-row{grid-template-columns:minmax(0,1fr) auto;gap:10px}.character-select-row .skill-toggle{min-width:82px;margin-left:2px}.preview-modal{width:98vw!important;max-height:97vh!important;padding:60px 10px 16px!important}.preview-modal>h2{font-size:1.4rem!important}.preview-actions button{font-size:1rem!important}}
</style></head><body>
<header class="topbar"><button class="hamburger" id="menuToggle"><i></i><i></i><i></i></button><b>英語物語 対戦ツール</b></header>
<aside class="sidebar" id="sidebar"><button class="active" data-page="calculator">計算機</button><button data-page="zukan">図鑑</button><button data-page="tier">Tier表</button></aside><main>
<section class="page active" id="page-calculator"><div class="panel"><div class="calculator-title"><h1>ダメージ計算機</h1><button class="swap" id="swap" type="button">⇄ 攻守を入れ替え</button><button class="reset-btn" id="resetAll" type="button">全リセット</button></div><div class="battle">
<article class="fighter attacker"><div class="fighter-title"><h2>攻撃キャラ</h2><div class="fighter-actions"><button class="mini-reset" id="attackerResetExceptCharacter" type="button">キャラ以外リセット</button><button class="mini-reset danger" id="attackerRemoveCharacter" type="button">キャラ削除</button></div></div><button class="pick" id="attackerPicker"><span class="portrait"></span><span><strong>未選択</strong><small>タップして図鑑から選択</small></span></button><div class="fields"><label>Power<input id="attackerPower" type="number" value="0"/></label><label>属性<select id="attackerAttribute"></select></label><label>イベント補正<select id="attackerEvent"><option value="1">なし（×1.0）</option><option value="1.5">あり（×1.5）</option></select></label><label>解答速度<select id="answerSpeed"><option value="1.2">Excellent（×1.2）</option><option value="1">Correct（×1.0）</option></select></label><label>自力モード<select id="selfMode"><option value="1.2">あり（×1.2）</option><option value="1">なし（×1.0）</option></select></label><label>問題レベル<select id="questionLevel"><option value="1.45">小学生（×1.45）</option><option value="1.5">中1（×1.5）</option><option value="1.55">中2（×1.55）</option><option value="1.6">中3（×1.6）</option><option value="1.65">高1（×1.65）</option><option value="1.7">高2（×1.7）</option><option value="1.75">高3（×1.75）</option><option selected="" value="1.8">難関（×1.8）</option></select></label><label>生存補正（ターン数）<select id="survivalTurns"></select></label><div class="progressive-fields inline-progressive" id="attackBuffFields"></div></div><div class="skill"><div><b>ゆるスキル</b><p id="attackerSkill">キャラ未選択</p><small id="attackerEffect"></small></div><button disabled="" id="attackerSkillBtn">スキル使用</button></div></article>
<article class="fighter defender"><div class="fighter-title"><h2>攻撃対象キャラ</h2><div class="fighter-actions"><button class="mini-reset" id="defenderResetExceptCharacter" type="button">キャラ以外リセット</button><button class="mini-reset danger" id="defenderRemoveCharacter" type="button">キャラ削除</button></div></div><button class="pick" id="defenderPicker"><span class="portrait"></span><span><strong>未選択</strong><small>タップして図鑑から選択</small></span></button><div class="fields"><label>HP<input id="defenderHp" type="number" value="0"/></label><label>属性<select id="defenderAttribute"></select></label><label>イベント補正<select id="defenderEvent"><option value="1">なし（×1.0）</option><option value="1.5">あり（×1.5）</option></select></label></div><div class="progressive-fields" id="cutRateFields"></div><div class="skill"><div><b>ゆるスキル</b><p id="defenderSkill">キャラ未選択</p><small id="defenderEffect"></small></div><button disabled="" id="defenderSkillBtn">スキル使用</button></div><div class="ghost"><h2>幽霊攻撃への耐久（攻撃対象キャラ）</h2><div id="ghostResult">攻撃対象のHPを入力してください</div></div></article></div>
<div class="result"><small>予想ダメージ</small><strong id="killResult">数値を入力してください</strong><div id="damageRange">0～0（0%～0%）</div><button class="download" id="downloadResult">結果を画像で保存</button></div></div></section>
<section class="page" id="page-zukan"><div class="panel"><h1>キャラ図鑑</h1><div class="toolbar"><input id="zkSearch" placeholder="キャラ名で検索"/><span id="zkCount"></span></div><div id="zkStatus">読み込み中...</div><div id="zkBox"></div></div></section>
<section class="page" id="page-tier"><div class="panel"><h1>Tier表</h1><div class="tier-controls"><label>モード<select id="mode"><option>ランクアップ率</option><option>使用者数</option></select></label><label>属性縛り<select id="attribute"><option value="">指定なし</option></select></label><label>コスト帯<select id="cost"><option value="">指定なし</option><option>低</option><option>中</option><option>高</option><option>超高</option></select></label><label>枠<select id="waku"><option value="">指定なし</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>補正<select id="hosei"><option value="0">含まない</option><option value="">含む</option><option value="1">補正のみ</option></select></label><label>信頼度<select id="minCount"><option value="5">低</option><option selected="" value="10">中</option><option value="20">高</option></select></label></div><button class="primary" id="tierBtn">Tierを生成・表示</button><div id="tierResult"></div></div></section></main>
<div class="overlay" hidden="" id="picker"><div class="modal picker-modal"><button class="close" data-close="picker">×</button><h2 id="pickerTitle">キャラを選択</h2><input id="pickerSearch" placeholder="キャラ名で検索"/><div id="pickerBox"></div></div></div>
<div class="overlay detail-overlay" hidden="" id="detail"><button class="detail-nav" id="detailPrev">‹</button><div class="modal detail-modal"><button class="close detail-close" data-close="detail">×</button><div class="detail-head"><img id="detailImage"/><div><h2 id="detailName"></h2><p id="detailMeta"></p></div></div><div class="stats" id="detailStats"></div><div class="skill-detail"><b>ゆるスキル</b><span id="detailTurn"></span><p id="detailSkill"></p></div><div class="actions" id="detailActions"><button data-role="attacker">攻撃キャラに設定</button><button data-role="defender">攻撃対象に設定</button><button data-role="picker">選択する</button></div></div><button class="detail-nav" id="detailNext">›</button></div>
<script src="app.js?v=20260821-35"></script><script id="eigo-layout-script-v35">
addEventListener('DOMContentLoaded',()=>{
  const battle=document.querySelector('#page-calculator .battle');
  const result=document.querySelector('#page-calculator .result');
  if(battle&&result&&!battle.parentElement.classList.contains('calculator-layout')){
    const layout=document.createElement('div');
    layout.className='calculator-layout';
    battle.before(layout);
    layout.append(battle,result);
  }
  const refreshCharacterSummary=role=>{
    const picker=document.getElementById(role+'Picker');
    const small=picker?.querySelector('small');
    const character=selected[role];
    if(!small)return;
    if(!character){small.textContent='タップして図鑑から選択';return}
    const d=character.details||{};
    const meta=[d.rare,canon(d.attribute),d.cost!=null?'Cost '+d.cost:null].filter(Boolean).join(' / ');
    const skill=d.skill||'スキルなし';
    small.textContent=meta+(meta?' / ':'')+'スキル: '+skill;
  };
  for(const role of ['attacker','defender']){
    const picker=document.getElementById(role+'Picker');
    const button=document.getElementById(role+'SkillBtn');
    const panel=button?.closest('.skill');
    if(!picker||!button||!panel)continue;
    let row=picker.parentElement;
    if(!row.classList.contains('character-select-row')){
      row=document.createElement('div');
      row.className='character-select-row';
      picker.before(row);
      row.append(picker,button);
    }
    button.classList.add('skill-toggle');
    panel.classList.add('readonly-skill');
    const label=panel.querySelector('b');
    if(label)label.textContent='ゆるスキル';
    const effect=document.getElementById(role+'Effect');
    if(effect&&!effect.textContent)effect.textContent='スキルを使用すると反映内容を表示します';
    panel.hidden=!button.classList.contains('active');
  }
  const baseSetCharacter=setCharacter;
  setCharacter=function(role,character,keep=false){
    baseSetCharacter(role,character,keep);
    refreshCharacterSummary(role);
  };
  const baseRemoveCharacter=removeCharacter;
  removeCharacter=function(role){
    baseRemoveCharacter(role);
    refreshCharacterSummary(role);
  };
  const baseSync=syncSkill;
  syncSkill=function(role){
    baseSync(role);
    const button=document.getElementById(role+'SkillBtn');
    const fighter=button?.closest('.fighter');
    const panel=fighter?.querySelector('.skill');
    if(panel)panel.hidden=!skillEnabled[role];
    const effect=document.getElementById(role+'Effect');
    if(effect&&skillEnabled[role]&&!effect.textContent)effect.textContent='計算への反映内容はありません';
  };
  for(const role of ['attacker','defender']){
    refreshCharacterSummary(role);
    syncSkill(role);
  }
});
</script></body></html>
