<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英語物語 対戦ツール</title><link rel="stylesheet" href="style.css?v=20260821-14"></head><body>
<header class="topbar"><button id="menuToggle" class="hamburger" aria-label="メニュー開閉"><i></i><i></i><i></i></button><b>英語物語 対戦ツール</b></header>
<div class="shell"><aside id="sidebar" class="sidebar open"><button data-page="calculator" class="active">計算機</button><button data-page="zukan">図鑑</button><button data-page="tier">Tier表</button><button data-page="opinion">意見箱</button></aside><main>
<section id="page-calculator" class="page active"><div class="panel"><h1>ダメージ計算機</h1><div class="battle">
<article class="fighter attacker"><h2>攻撃キャラ</h2><button id="attackerPicker" class="pick"><span class="portrait"></span><span><strong>未選択</strong><small>タップして図鑑から選択</small></span></button>
<div class="fields three"><label>Power<input id="attackerPower" type="number" value="0"></label><label>属性<select id="attackerAttribute"></select></label><label>イベント補正<select id="attackerEvent"><option value="1">なし（×1.0）</option><option value="1.5">あり（×1.5）</option></select></label></div>
<div class="fields three"><label>解答速度<select id="answerSpeed"><option value="1.2">Excellent（×1.2）</option><option value="1">Correct（×1.0）</option></select></label><label>自力モード<select id="selfMode"><option value="1.2">あり（×1.2）</option><option value="1">なし（×1.0）</option></select></label><label>問題レベル<select id="questionLevel"><option value="1.45">小学生（×1.45）</option><option value="1.5">中1（×1.5）</option><option value="1.55">中2（×1.55）</option><option value="1.6">中3（×1.6）</option><option value="1.65">高1（×1.65）</option><option value="1.7">高2（×1.7）</option><option value="1.75">高3（×1.75）</option><option value="1.8" selected>難関（×1.8）</option></select></label></div>
<div class="fields three manual"><label>追加攻撃力増加量1（%）<input id="attackBoost1" type="number" value="0"></label><label>追加攻撃力増加量2（%）<input id="attackBoost2" type="number" value="0"></label><label>追加攻撃力増加量3（%）<input id="attackBoost3" type="number" value="0"></label></div>
<div class="skill"><div><b>ゆるスキル</b><p id="attackerSkill">キャラ未選択</p><small id="attackerEffect"></small></div><button id="attackerSkillBtn" disabled>スキル使用</button></div></article>
<article class="fighter defender"><h2>攻撃対象キャラ</h2><button id="defenderPicker" class="pick"><span class="portrait"></span><span><strong>未選択</strong><small>タップして図鑑から選択</small></span></button>
<div class="fields three"><label>HP<input id="defenderHp" type="number" value="0"></label><label>属性<select id="defenderAttribute"></select></label><label>イベント補正<select id="defenderEvent"><option value="1">なし（×1.0）</option><option value="1.5">あり（×1.5）</option></select></label></div>
<div class="fields three manual"><label>追加軽減率1（%）<input id="cutRate1" type="number" value="0"></label><label>追加軽減率2（%）<input id="cutRate2" type="number" value="0"></label><label>追加軽減率3（%）<input id="cutRate3" type="number" value="0"></label></div>
<div class="fields three manual"><label>追加軽減率4（%）<input id="cutRate4" type="number" value="0"></label><label>追加軽減率5（%）<input id="cutRate5" type="number" value="0"></label><label>追加軽減率6（%）<input id="cutRate6" type="number" value="0"></label></div>
<div class="skill"><div><b>ゆるスキル</b><p id="defenderSkill">キャラ未選択</p><small id="defenderEffect"></small></div><button id="defenderSkillBtn" disabled>スキル使用</button></div></article></div>
<button id="swap" class="swap">⇄ 攻守を入れ替え</button><div class="result"><small>予想ダメージ</small><div id="damageRange">0～0 ダメージ（基準 0）</div><p>属性相性 <b id="attributeRate">1</b>　1発あたり <b id="damagePercent">0%～0%（基準0%）</b></p><p id="killResult">数値を入力してください</p></div><div class="ghost"><h2>幽霊攻撃への耐久（攻撃対象キャラ）</h2><div id="ghostResult">攻撃対象のHPを入力してください</div></div></div></section>
<section id="page-zukan" class="page"><div class="panel"><h1>キャラ図鑑</h1><div class="toolbar"><input id="zkSearch" placeholder="キャラ名で検索"><span id="zkCount"></span></div><div id="zkStatus">読み込み中...</div><div id="zkBox"></div></div></section>
<section id="page-tier" class="page"><div class="panel"><h1>Tier表</h1><div class="tier-controls"><label>モード<select id="mode"><option>ランクアップ率</option><option>使用者数</option></select></label><label>属性縛り<select id="attribute"><option value="">指定なし</option></select></label><label>コスト帯<select id="cost"><option value="">指定なし</option><option>低</option><option>中</option><option>高</option><option>超高</option></select></label><label>枠<select id="waku"><option value="">指定なし</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>補正<select id="hosei"><option value="0">含まない</option><option value="">含む</option><option value="1">補正のみ</option></select></label><label>信頼度<select id="minCount"><option value="5">低</option><option value="10" selected>中</option><option value="20">高</option></select></label></div><button id="tierBtn" class="primary">Tierを生成・表示</button><div id="tierResult"></div></div></section>
<section id="page-opinion" class="page"><div class="panel opinion"><h1>意見箱</h1><p>匿名で送信されます。要望・不具合・感想を入力してください。</p><textarea id="opinionText" rows="7" placeholder="要望・不具合・感想など"></textarea><button id="opinionSubmit" class="primary">送信</button><p id="opinionMsg"></p></div></section></main></div>
<div id="picker" class="overlay" hidden><div class="modal picker-modal"><button class="close" data-close="picker">×</button><h2 id="pickerTitle">キャラを選択</h2><input id="pickerSearch" placeholder="キャラ名で検索"><div id="pickerBox"></div></div></div>
<div id="detail" class="overlay detail-overlay" hidden><button id="detailPrev" class="detail-nav">‹</button><div class="modal detail-modal"><button class="close" data-close="detail">×</button><div class="detail-head"><img id="detailImage" alt=""><div><h2 id="detailName"></h2><p id="detailMeta"></p></div></div><div id="detailStats" class="stats"></div><div class="skill-detail"><b>ゆるスキル</b><span id="detailTurn"></span><p id="detailSkill"></p></div><div id="detailActions" class="actions"><button data-role="attacker">攻撃キャラに設定</button><button data-role="defender">攻撃対象に設定</button><button data-role="picker">選択する</button></div></div><button id="detailNext" class="detail-nav">›</button></div>
<script src="app.js?v=20260821-14"></script></body></html>
