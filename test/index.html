<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英語物語 対戦ツール</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"><link rel="stylesheet" href="style.css"></head><body>
<header class="topbar"><button id="menuToggle" class="hamburger" aria-label="メニューを開閉"><span></span><span></span><span></span></button><b>英語物語 対戦ツール</b></header>
<div class="layout"><aside id="sidebar" class="sidebar open"><nav><button data-page="calculator" class="navitem active">計算機</button><button data-page="zukan" class="navitem">図鑑</button><button data-page="tier" class="navitem">Tier表</button><button id="openOpinion" class="navitem">意見箱</button></nav></aside><main class="content">
<section id="page-calculator" class="page active"><div class="panel"><h1>ダメージ計算機</h1><div class="battle-grid">
<article class="side attack"><h2>攻撃キャラ</h2><button id="attackerPicker" class="character-pick"><span class="character-image"></span><span><strong>未選択</strong><small>タップして図鑑から選択</small></span></button><div class="fields"><label>Power<input id="attackerPower" type="number" value="0"></label><label>属性<select id="attackerAttribute"></select></label><label>攻撃力上昇率（%・カンマ区切り）<input id="attackBoosts" type="text" placeholder="例: 20,30"></label></div><div class="skill"><p id="attackerSkill">キャラ未選択</p><button id="attackerSkillBtn" disabled>スキル使用</button></div></article>
<article class="side defend"><h2>攻撃対象キャラ</h2><button id="defenderPicker" class="character-pick"><span class="character-image"></span><span><strong>未選択</strong><small>タップして図鑑から選択</small></span></button><div class="fields"><label>HP<input id="defenderHp" type="number" value="0"></label><label>属性<select id="defenderAttribute"></select></label><label>軽減率（%・カンマ区切り）<input id="cutRates" type="text" placeholder="例: 30,20"></label></div><div class="skill"><p id="defenderSkill">キャラ未選択</p><button id="defenderSkillBtn" disabled>スキル使用</button></div></article></div>
<button id="swap" class="swap">⇄ 攻守を入れ替え</button><div class="results"><div><span>最小</span><b id="damageMin">0</b></div><div><span>基準</span><b id="damageBase">0</b></div><div><span>最大</span><b id="damageMax">0</b></div><div class="wide" id="killResult">数値を入力してください</div></div><div class="ghost"><h2>幽霊攻撃への耐久</h2><div id="ghostResult">攻撃対象のHPを入力してください</div></div></div></section>
<section id="page-zukan" class="page"><div class="panel"><h1>キャラ図鑑</h1><input id="zkSearch" class="search" placeholder="キャラ名で検索"><div id="zkStatus">読み込み中...</div><div id="zkBox" class="zukan-grid"></div></div></section>
<section id="page-tier" class="page"><div class="panel"><h1>Tier表</h1><div class="tier-controls"><label>モード<select id="mode"><option>ランクアップ率</option><option>使用者数</option></select></label><label>属性縛り<select id="attribute"><option value="">指定なし</option></select></label><label>コスト帯<select id="cost"><option value="">指定なし</option><option>低</option><option>中</option><option>高</option><option>超高</option></select></label><label>枠<select id="waku"><option value="">指定なし</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>補正<select id="hosei"><option value="0">含まない</option><option value="">含む</option><option value="1">補正のみ</option></select></label><label>信頼度<select id="minCount"><option value="5">低</option><option value="10" selected>中</option><option value="20">高</option></select></label></div><button id="tierBtn">Tierを生成・表示</button><div id="tierResult"></div></div></section>
</main></div>
<div id="picker" class="modalx" hidden><div class="modalpanel pickerpanel"><button class="close" data-close="picker">×</button><h2 id="pickerTitle">キャラを選択</h2><input id="pickerSearch" class="search" placeholder="キャラ名で検索"><div id="pickerGrid" class="zukan-grid"></div></div></div>
<div id="detail" class="modalx" hidden><div class="modalpanel"><button class="close" data-close="detail">×</button><div class="detail-head"><img id="detailImage"><div><h2 id="detailName"></h2><p id="detailMeta"></p></div></div><div id="detailStats" class="detail-stats"></div><div id="detailSkill" class="detail-skill"></div><div id="detailActions" class="detail-actions"><button data-role="attacker">攻撃キャラに設定</button><button data-role="defender">攻撃対象に設定</button><button data-role="picker">選択する</button></div></div></div>
<div id="opinion" class="modalx" hidden><div class="modalpanel"><button class="close" data-close="opinion">×</button><h2>意見箱</h2><p>匿名で送信されます</p><textarea id="opinionText" rows="5" placeholder="要望・不具合・感想など"></textarea><button id="opinionSubmit">送信</button><p id="opinionMsg"></p></div></div>
<script src="app.js"></script></body></html>
