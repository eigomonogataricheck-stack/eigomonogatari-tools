<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>英語物語 対戦ツール</title><link href="style.css?v=20260821-26" rel="stylesheet"/><meta content="20260821-26" name="eigo-ui-build"/></head><body>
<header class="topbar"><button aria-label="メニュー開閉" class="hamburger" id="menuToggle"><i></i><i></i><i></i></button><b>英語物語 対戦ツール</b></header>
<aside class="sidebar" id="sidebar"><button class="active" data-page="calculator">計算機</button><button data-page="zukan">図鑑</button><button data-page="tier">Tier表</button></aside><main>
<section class="page active" id="page-calculator"><div class="panel"><h1>ダメージ計算機</h1><div class="battle">
<article class="fighter attacker"><h2>攻撃キャラ</h2><button class="pick" id="attackerPicker"><span class="portrait"></span><span><strong>未選択</strong><small>タップして図鑑から選択</small></span></button><div class="fields three attacker-fields">
<label>Power<input id="attackerPower" type="number" value="0"/></label><label>属性<select id="attackerAttribute"></select></label><label>イベント補正<select id="attackerEvent"><option value="1">なし（×1.0）</option><option value="1.5">あり（×1.5）</option></select></label>
<label>解答速度<select id="answerSpeed"><option value="1.2">Excellent（×1.2）</option><option value="1">Correct（×1.0）</option></select></label><label>自力モード<select id="selfMode"><option value="1.2">あり（×1.2）</option><option value="1">なし（×1.0）</option></select></label><label>問題レベル<select id="questionLevel"><option value="1.45">小学生（×1.45）</option><option value="1.5">中1（×1.5）</option><option value="1.55">中2（×1.55）</option><option value="1.6">中3（×1.6）</option><option value="1.65">高1（×1.65）</option><option value="1.7">高2（×1.7）</option><option value="1.75">高3（×1.75）</option><option selected="" value="1.8">難関（×1.8）</option></select></label>
<label class="survival-field">生存補正（ターン数）<select id="survivalTurns"></select></label><div class="attack-buff-group"><span>追加攻撃力増加（最大5件）</span><div class="progressive-fields" id="attackBuffFields"></div></div>
</div><div class="skill"><div><b>ゆるスキル</b><p id="attackerSkill">キャラ未選択</p><small id="attackerEffect"></small></div><button disabled="" id="attackerSkillBtn">スキル使用</button></div></article>
<article class="fighter defender"><h2>攻撃対象キャラ</h2><button class="pick" id="defenderPicker"><span class="portrait"></span><span><strong>未選択</strong><small>タップして図鑑から選択</small></span></button><div class="fields three defender-fields"><label>HP<input id="defenderHp" type="number" value="0"/></label><label>属性<select id="defenderAttribute"></select></label><label>イベント補正<select id="defenderEvent"><option value="1">なし（×1.0）</option><option value="1.5">あり（×1.5）</option></select></label></div><div class="progressive-fields" id="cutRateFields"></div><div class="skill"><div><b>ゆるスキル</b><p id="defenderSkill">キャラ未選択</p><small id="defenderEffect"></small></div><button disabled="" id="defenderSkillBtn">スキル使用</button></div><div class="ghost"><h2>幽霊攻撃への耐久（攻撃対象キャラ）</h2><div id="ghostResult">攻撃対象のHPを入力してください</div></div></article></div>
<button class="swap" id="swap">⇄ 攻守を入れ替え</button><div class="result"><small>予想ダメージ</small><strong id="killResult">数値を入力してください</strong><div id="damageRange">0～0（0%～0%）</div><button class="download" id="downloadResult">結果を画像で保存</button></div></div></section>
<section class="page" id="page-zukan"><div class="panel"><h1>キャラ図鑑</h1><div class="toolbar"><input id="zkSearch" placeholder="キャラ名で検索"/><span id="zkCount"></span></div><div id="zkStatus">読み込み中...</div><div id="zkBox"></div></div></section>
<section class="page" id="page-tier"><div class="panel"><h1>Tier表</h1><div class="tier-controls"><label>モード<select id="mode"><option>ランクアップ率</option><option>使用者数</option></select></label><label>属性縛り<select id="attribute"><option value="">指定なし</option></select></label><label>コスト帯<select id="cost"><option value="">指定なし</option><option>低</option><option>中</option><option>高</option><option>超高</option></select></label><label>枠<select id="waku"><option value="">指定なし</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>補正<select id="hosei"><option value="0">含まない</option><option value="">含む</option><option value="1">補正のみ</option></select></label><label>信頼度<select id="minCount"><option value="5">低</option><option selected="" value="10">中</option><option value="20">高</option></select></label></div><button class="primary" id="tierBtn">Tierを生成・表示</button><div id="tierResult"></div></div></section></main>
<div class="overlay" hidden="" id="picker"><div class="modal picker-modal"><button class="close" data-close="picker">×</button><h2 id="pickerTitle">キャラを選択</h2><input id="pickerSearch" placeholder="キャラ名で検索"/><div id="pickerBox"></div></div></div>
<div class="overlay detail-overlay" hidden="" id="detail"><button class="detail-nav" id="detailPrev">‹</button><div class="modal detail-modal"><button class="close" data-close="detail">×</button><div class="detail-head"><img id="detailImage"/><div><h2 id="detailName"></h2><p id="detailMeta"></p></div></div><div class="stats" id="detailStats"></div><div class="skill-detail"><b>ゆるスキル</b><span id="detailTurn"></span><p id="detailSkill"></p></div><div class="actions" id="detailActions"><button data-role="attacker">攻撃キャラに設定</button><button data-role="defender">攻撃対象に設定</button><button data-role="picker">選択する</button></div></div><button class="detail-nav" id="detailNext">›</button></div>
<div class="overlay" hidden="" id="resultPreview"><div class="modal preview-modal"><button class="close" data-close="resultPreview">×</button><h2>保存画像のプレビュー</h2><img alt="ダメージ計算結果のプレビュー" id="resultPreviewImage"/><div class="preview-actions"><button class="primary" id="previewDownload">画像をダウンロード</button><button id="previewClose" type="button">閉じる</button></div></div></div><script src="app.js?v=20260821-26"></script></body></html>
