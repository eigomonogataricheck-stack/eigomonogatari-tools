<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>英語物語 対戦ツール</title><link href="style.css?v=20260831-74" rel="stylesheet"><meta content="20260831-74" name="eigo-ui-build"></head><body>
<header class="topbar"><button class="hamburger" id="menuToggle"><i></i><i></i><i></i></button><b>英語物語 対戦ツール</b></header>
<aside class="sidebar" id="sidebar"><button class="active" data-page="calculator">計算機</button><button data-page="zukan">図鑑</button><button data-page="tier">Tier表</button></aside><main>
<section class="page active" id="page-calculator"><div class="panel"><div class="calculator-title"><h1>ダメージ計算機</h1><button class="swap" id="swap" type="button">⇄ 攻守を入れ替え</button><div class="calculator-actions"><button class="detail-mode-btn" id="detailMode" type="button" aria-pressed="false">詳細モード OFF</button><button class="reset-btn" id="resetAll" type="button">全リセット</button></div></div><div class="calculator-layout"><div class="battle">
<article class="fighter attacker"><div class="fighter-title"><h2>攻撃キャラ</h2><div class="fighter-actions"><button class="mini-reset" id="attackerResetExceptCharacter" type="button">キャラ以外リセット</button><button class="mini-reset danger" id="attackerRemoveCharacter" type="button">キャラ削除</button></div></div><button class="pick" id="attackerPicker"><span class="portrait"></span><span><strong>未選択</strong><small>タップして図鑑から選択</small></span></button><div class="fields"><label>Power<input id="attackerPower" type="number" value="0"></label><label>属性<select id="attackerAttribute"></select></label><label>イベント補正<select id="attackerEvent"><option value="1">なし（×1.0）</option><option value="1.5">あり（×1.5）</option></select></label><label>解答速度<select id="answerSpeed"><option value="1.2">Excellent（×1.2）</option><option value="1">Correct（×1.0）</option></select></label><label>自力モード<select id="selfMode"><option value="1.2">あり（×1.2）</option><option value="1">なし（×1.0）</option></select></label><label>問題レベル<select id="questionLevel"><option value="1.45">小学生（×1.45）</option><option value="1.5">中1（×1.5）</option><option value="1.55">中2（×1.55）</option><option value="1.6">中3（×1.6）</option><option value="1.65">高1（×1.65）</option><option value="1.7">高2（×1.7）</option><option value="1.75">高3（×1.75）</option><option selected value="1.8">難関（×1.8）</option></select></label><label class="detail-mode-target">生存補正（ターン数）<select id="survivalTurns"></select></label><label class="detail-mode-target">全体攻撃<select id="allAttack"><option value="0">なし</option><option value="1">あり（×5）</option></select></label><div class="progressive-fields inline-progressive" id="attackBuffFields"></div><div class="progressive-fields detail-mode-target" id="extraHitFields"></div></div><div class="skill"><div><b>ゆるスキル</b><p id="attackerSkill">キャラ未選択</p><small id="attackerEffect"></small></div><button disabled id="attackerSkillBtn">スキル使用</button></div></article>
<article class="fighter defender"><div class="fighter-title"><h2>攻撃対象キャラ</h2><div class="fighter-actions"><button class="mini-reset" id="defenderResetExceptCharacter" type="button">キャラ以外リセット</button><button class="mini-reset danger" id="defenderRemoveCharacter" type="button">キャラ削除</button></div></div><button class="pick" id="defenderPicker"><span class="portrait"></span><span><strong>未選択</strong><small>タップして図鑑から選択</small></span></button><div class="fields"><label>HP<input id="defenderHp" type="number" value="0"></label><label>属性<select id="defenderAttribute"></select></label><label>イベント補正<select id="defenderEvent"><option value="1">なし（×1.0）</option><option value="1.5">あり（×1.5）</option></select></label></div><div class="progressive-fields" id="cutRateFields"></div><div class="progressive-fields detail-mode-target" id="extraHealFields"></div><div class="skill"><div><b>ゆるスキル</b><p id="defenderSkill">キャラ未選択</p><small id="defenderEffect"></small></div><button disabled id="defenderSkillBtn">スキル使用</button></div><div class="durability"><h2>耐久値</h2><b id="durabilityValue">0</b></div><div class="ghost detail-mode-target"><h2>幽霊攻撃への耐久（攻撃対象キャラ）</h2><div id="ghostResult">攻撃対象のHPを入力してください</div></div></article></div>
<div class="result"><small>予想ダメージ</small><strong id="killResult">数値を入力してください</strong><div id="multiHitResult" class="multi-hit-result"></div><div id="damageRange">0～0（0%～0%）</div><div id="remainingHp" class="remaining-hp"></div><div id="allAttackWarning" class="calculation-warning"></div><button class="download" id="downloadResult">結果を画像で保存</button></div></div></div></section>
<section class="page" id="page-zukan"><div class="panel"><h1>キャラ図鑑</h1><div class="toolbar"><input id="zkSearch" placeholder="キャラ名で検索"><button class="filter-toggle" id="zkFilterToggle" type="button">絞り込み・ソート</button><span id="zkCount"></span></div><section class="zukan-filter" id="zkFilter" hidden><div class="filter-section"><h2>一般</h2><label>属性<select id="zkAttribute"><option value="">指定なし</option><option>火</option><option>水</option><option>風</option><option>火水</option><option>水風</option><option>風火</option><option value="全">全属性</option></select></label><label>レア<select id="zkRare"><option value="">指定なし</option><option>N</option><option>R</option><option>CR</option><option>ZR</option><option>MZR</option><option>伝</option></select></label><label>Cost 最小<input id="zkCostMin" type="number" min="0" placeholder="0"></label><label>Cost 最大<input id="zkCostMax" type="number" min="0" placeholder="上限なし"></label></div><div class="filter-section"><h2>スキル</h2><label>ゆるスキル<select id="zkSkill"><option value="">指定なし</option><option value="攻撃力アップ">攻撃</option><option value="連撃">連続</option><option value="全体攻撃">全体</option><option value="シールド">シールド</option><option value="回復">回復</option><option value="蘇生">蘇生</option><option value="色変">変化</option><option value="短縮">短縮</option><option value="遅延">遅延</option><option value="集中">かばう</option><option value="かわす">かわす</option></select></label><label>スキルターン 最小<input id="zkTurnMin" type="number" min="0" placeholder="0"></label><label>スキルターン 最大<input id="zkTurnMax" type="number" min="0" placeholder="上限なし"></label></div><div class="filter-section filter-sort"><h2>ソート</h2><label>項目<select id="zkSort"><option value="">図鑑順</option><option value="hp">HP</option><option value="power">攻撃力</option><option value="total">HP+攻撃力</option><option value="cost">Cost</option><option value="skillTurn">スキルターン</option><option value="rare">レア</option></select></label><label>順序<select id="zkSortDirection"><option value="desc">降順</option><option value="asc">昇順</option></select></label><button id="zkFilterClear" type="button">初期化</button></div></section><div id="zkStatus">読み込み中...</div><div id="zkBox"></div></div></section>
<section class="page" id="page-tier"><div class="panel"><h1>Tier表</h1><div class="tier-controls"><label>モード<select id="mode"><option>ランクアップ率</option><option>使用者数</option></select></label><label>属性縛り<select id="attribute"><option value="">指定なし</option></select></label><label>コスト帯<select id="cost"><option value="">指定なし</option><option>低</option><option>中</option><option>高</option><option>超高</option></select></label><label>枠<select id="waku"><option value="">指定なし</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>補正<select id="hosei"><option value="0">含まない</option><option value="">含む</option><option value="1">補正のみ</option></select></label><label>信頼度<select id="minCount"><option value="5">低</option><option selected value="10">中</option><option value="20">高</option></select></label></div><button class="primary" id="tierBtn">Tierを生成・表示</button><div id="tierResult"></div></div></section></main>
<div class="overlay" hidden id="picker"><div class="modal picker-modal"><button class="close close-button" data-close="picker">×</button><h2 id="pickerTitle">キャラを選択</h2><input id="pickerSearch" placeholder="キャラ名で検索"><div id="pickerBox"></div></div></div>
<div class="overlay detail-overlay" hidden id="detail"><button class="detail-nav" id="detailPrev">‹</button><div class="modal detail-modal"><button class="close close-button detail-close" data-close="detail">×</button><div class="detail-head"><img id="detailImage"><div><h2 id="detailName"></h2><p id="detailMeta"></p></div></div><div class="stats" id="detailStats"></div><div class="skill-detail"><b>ゆるスキル</b><span id="detailTurn"></span><p id="detailSkill"></p></div><div class="actions" id="detailActions"><button data-role="attacker">攻撃キャラに設定</button><button data-role="defender">攻撃対象に設定</button><button data-role="picker">選択する</button></div></div><button class="detail-nav" id="detailNext">›</button></div>
<script src="app.js?v=20260831-74"></script><script src="catalog.js?v=20260831-74"></script><script src="calculator.js?v=20260831-74"></script><script src="tier.js?v=20260822-55"></script></body></html>
