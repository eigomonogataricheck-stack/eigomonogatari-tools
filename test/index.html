<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英語物語 対戦ツール</title><style>body{padding:20px;background:#f8f9fa;font-family:sans-serif}
.container{max-width:640px;background:#fff;padding:25px;border-radius:15px;box-shadow:0 4px 15px rgba(0,0,0,.1);margin:auto}
.tier-row{display:flex;align-items:center;border-bottom:1px solid #dee2e6;padding:10px 0}
.rank-label{width:50px;font-weight:bold;font-size:1.1rem;color:#333}
.icon-list img{width:45px;height:45px;margin:2px;border-radius:5px;border:1px solid #ccc}
label{font-size:.85rem;font-weight:bold;color:#666;margin-top:8px}
.small-info{font-size:.75rem;color:#888;font-weight:normal}
.zk-l1{margin-bottom:8px}
.zk-b1{width:100%;text-align:left;font-weight:bold;font-size:.9rem;padding:8px 14px;border:none;border-radius:8px;cursor:pointer;color:#fff;display:flex;justify-content:space-between;align-items:center}
.zk-b1:hover{filter:brightness(1.1)}
.zk-b2{width:100%;text-align:left;font-weight:bold;font-size:.82rem;padding:6px 12px;border:1px solid #dee2e6;border-radius:6px;cursor:pointer;background:#e9ecef;color:#333;display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.zk-b2:hover{background:#dee2e6}
.zk-b3{width:100%;text-align:left;font-weight:bold;font-size:.76rem;padding:5px 10px;border:1px solid #eee;border-radius:5px;cursor:pointer;background:#f8f9fa;color:#495057;display:flex;justify-content:space-between;align-items:center;margin-top:3px}
.zk-b3:hover{background:#e9ecef}
.zk-b1 .ar,.zk-b2 .ar,.zk-b3 .ar{transition:transform .2s;font-size:.65rem}
.zk-b1.op .ar,.zk-b2.op .ar,.zk-b3.op .ar{transform:rotate(90deg)}
.zk-bd{display:none;padding:4px 4px 4px 8px}
.zk-bd.op{display:block}
.zk-head{font-size:.72rem;font-weight:bold;color:#fff;background:#6c757d;padding:3px 8px;border-radius:4px;margin:8px 0 4px;width:100%}
.zk-grid{display:flex;flex-wrap:wrap;gap:4px;padding:2px 0}
.zk-card{width:64px;text-align:center;transition:transform .12s}
.zk-card:hover{transform:scale(1.1)}
.zk-card img{width:54px;height:54px;border-radius:6px;border:1px solid #dee2e6;object-fit:cover;background:#f0f0f0}
.zk-name{font-size:.52rem;line-height:1.1;margin-top:1px;word-break:break-all;color:#555}
.zk-match img{border:2px solid #ffc107!important;box-shadow:0 0 5px rgba(255,193,7,.5)}
.zk-match .zk-name{color:#d63384;font-weight:bold}


/* キャラ詳細 */
.zk-has-details{cursor:pointer;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.zk-has-details img{box-shadow:0 0 0 2px rgba(25,135,84,.18)}
.zk-has-details::after{content:'詳細';display:inline-block;margin-top:2px;padding:1px 4px;border-radius:999px;background:#e8f5ee;color:#157347;font-size:.46rem;font-weight:bold}
.zk-has-details:focus-visible{outline:3px solid rgba(13,110,253,.35);outline-offset:2px;border-radius:7px}
.zk-pressing{transform:scale(.94)!important;opacity:.72}
body.zk-modal-open{overflow:hidden}
.zk-modal{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(20,25,30,.62);backdrop-filter:blur(3px)}
.zk-modal.op{display:flex}
.zk-modal-panel{position:relative;width:min(100%,430px);max-height:88vh;overflow:auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 18px 55px rgba(0,0,0,.28)}
.zk-modal-close{position:absolute;top:9px;right:11px;width:36px;height:36px;border:0;border-radius:50%;background:#f1f3f5;color:#495057;font-size:1.6rem;line-height:1;cursor:pointer}
.zk-modal-close:hover{background:#e9ecef}
.zk-modal-hero{display:flex;align-items:center;gap:16px;padding-right:30px;margin-bottom:16px}
.zk-modal-image{width:92px;height:92px;border-radius:13px;border:1px solid #dee2e6;object-fit:cover;background:#f0f0f0}
.zk-modal-name{margin:0 0 5px;font-size:1.15rem;font-weight:700;line-height:1.35}
.zk-modal-meta{color:#198754;font-size:.84rem;font-weight:700}
.zk-modal-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.zk-stat{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:8px;background:#f8f9fa;font-size:.78rem}
.zk-stat span{color:#6c757d}
.zk-stat strong{color:#212529}
.zk-modal-skill-block{margin-top:15px;padding:12px;border-radius:10px;background:#f0f8f3;border-left:4px solid #198754}
.zk-modal-label{margin-bottom:4px;color:#157347;font-size:.75rem;font-weight:700}
.zk-modal-skill{margin:0;color:#343a40;font-size:.88rem;line-height:1.65}
@media (max-width:480px){
  .zk-modal{align-items:flex-end;padding:10px}
  .zk-modal-panel{width:100%;max-height:90vh;border-radius:18px 18px 12px 12px;padding:20px}
  .zk-modal-image{width:82px;height:82px}
}


/* 属性テーマ・キャラ切り替え */
.zk-modal-panel{--zk-accent:#6c757d;--zk-soft:#f1f3f5;--zk-theme:#6c757d;--zk-theme-soft:#f1f3f5;background:#fff;overflow:hidden}
.zk-modal-panel::before{content:'';position:absolute;z-index:1;top:0;left:0;right:0;height:8px;background:var(--zk-theme)}
.zk-modal-image{border:3px solid var(--zk-accent);box-shadow:0 5px 16px color-mix(in srgb,var(--zk-accent) 24%,transparent)}
.zk-modal-meta{color:var(--zk-accent)}
.zk-modal-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
.zk-stat{background:var(--zk-theme-soft)}
.zk-stat strong{color:var(--zk-accent)}
.zk-modal-skill-block{background:var(--zk-theme-soft);border-left-color:var(--zk-accent)}
.zk-modal-label{color:var(--zk-accent)}
.zk-modal-skill-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:5px}
.zk-modal-turn{flex:none;padding:3px 8px;border-radius:999px;background:var(--zk-theme);color:#fff;font-size:.7rem;font-weight:700}
.zk-modal-nav{position:relative;z-index:2;flex:0 0 auto;width:46px;height:64px;border:0;border-radius:12px;background:rgba(255,255,255,.94);color:#343a40;font-size:2rem;line-height:1;box-shadow:0 5px 18px rgba(0,0,0,.22);cursor:pointer}
.zk-modal-nav:hover{transform:scale(1.06);background:#fff}
.zk-modal-prev{margin-right:12px}
.zk-modal-next{margin-left:12px}
@media (max-width:600px){
  .zk-modal{display:none;grid-template-columns:42px minmax(0,1fr) 42px;align-items:end;gap:5px;padding:10px 4px}
  .zk-modal.op{display:grid}
  .zk-modal-panel{grid-column:2;width:100%;padding:18px 16px}
  .zk-modal-nav{position:fixed;top:50%;transform:translateY(-50%);width:40px;height:58px;border-radius:10px;font-size:1.65rem}
  .zk-modal-nav:hover{transform:translateY(-50%) scale(1.04)}
  .zk-modal-prev{left:3px;margin:0}
  .zk-modal-next{right:3px;margin:0}
}


/* スマホ操作とTier詳細 */
.zk-card,.zk-card img,.icon-list img{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.zk-card img,.icon-list img{-webkit-user-drag:none}
.icon-list img[data-tier-id]{cursor:pointer;transition:transform .12s,box-shadow .12s}
.icon-list img[data-tier-id]:hover{transform:scale(1.08);box-shadow:0 0 0 2px rgba(13,110,253,.25)}
.icon-list img[data-tier-id]:focus-visible{outline:3px solid rgba(13,110,253,.4);outline-offset:2px}
@media (max-width:600px){
  .zk-modal{display:none;grid-template-columns:42px minmax(0,1fr) 42px;align-items:center;gap:5px;padding:10px 4px}
  .zk-modal.op{display:grid}
  .zk-modal-panel{grid-column:2;align-self:center;width:100%;max-height:88vh;border-radius:18px;padding:18px 16px}
}


/* 鮮明な属性表示・タップ操作 */
.zk-has-details{touch-action:manipulation}
.zk-has-details::after{background:var(--zk-accent,#157347);color:#fff}
.zk-stat{border:2px solid color-mix(in srgb,var(--zk-accent) 58%,#fff);box-shadow:inset 5px 0 0 var(--zk-accent)}
.zk-modal-skill-block{border-top:2px solid color-mix(in srgb,var(--zk-accent) 58%,#fff);border-right:2px solid color-mix(in srgb,var(--zk-accent) 58%,#fff);border-bottom:2px solid color-mix(in srgb,var(--zk-accent) 58%,#fff)}
.zk-modal-meta,.zk-stat strong,.zk-modal-label{filter:saturate(1.55)}


/* ステータス枠は元の形に戻し、色選定だけを調整 */
.zk-stat{border:0;box-shadow:none;background:var(--zk-theme-soft)}
.zk-modal-skill-block{border-top:0;border-right:0;border-bottom:0;border-left:4px solid var(--zk-accent)}
.zk-modal-meta,.zk-stat strong,.zk-modal-label{filter:none}

/* 意見箱 */
.opinion-box{padding:18px;border:1px solid #dee2e6;border-radius:12px;background:#fff}
.opinion-title{margin:0 0 8px;color:#555;font-size:14px}
.opinion-msg{min-height:20px;margin:8px 0 0;font-size:13px;color:#888}
.opinion-success{color:#198754}
.opinion-error{color:#dc3545}


/* 今回の視認性調整: 詳細表示は控えめ、ステータス枠は通常形 */
.zk-has-details::after{background:#e8f5ee;color:#157347;font-size:.46rem;padding:1px 4px;box-shadow:none}
.zk-stat{border:0!important;box-shadow:none!important;background:var(--zk-theme-soft)}
.zk-modal-skill-block{border-top:0!important;border-right:0!important;border-bottom:0!important;border-left:4px solid var(--zk-accent)!important}


/* 画面幅を広く使用 */
.container{width:calc(100vw - 32px);max-width:1600px!important;margin:0 auto;padding:28px 32px}
@media (max-width:767px){body{padding:8px}.container{width:100%;max-width:none!important;padding:16px}}

/* 詳細画像の属性枠。複合属性では --zk-theme がグラデーションになる */
.zk-modal-image-frame{flex:0 0 auto;width:98px;height:98px;padding:3px;border-radius:15px;background:var(--zk-theme);box-shadow:0 5px 16px color-mix(in srgb,var(--zk-accent) 24%,transparent)}
.zk-modal-image-frame .zk-modal-image{display:block;width:100%;height:100%;border:0!important;border-radius:12px;box-shadow:none;object-fit:cover;background:#f0f0f0}
@media (max-width:480px){.zk-modal-image-frame{width:88px;height:88px}}


/* スキル説明文の属性語・数値強調 */
.skill-attribute{display:inline;padding:0 .14em;border-radius:.28em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.skill-attribute-fire{color:#c62828;background:rgba(239,83,80,.16);box-shadow:inset 0 -2px 0 rgba(229,57,53,.58)}
.skill-attribute-water{color:#0d47a1;background:rgba(66,165,245,.17);box-shadow:inset 0 -2px 0 rgba(25,118,210,.58)}
.skill-attribute-wind{color:#4f7300;background:rgba(139,195,74,.20);box-shadow:inset 0 -2px 0 rgba(124,191,25,.62)}
.skill-attribute-all{color:#6a1b9a;background:rgba(171,71,188,.15);box-shadow:inset 0 -2px 0 rgba(142,36,170,.52)}
.skill-number{display:inline;padding:0 .12em;border-radius:.22em;color:#8a4f00;background:linear-gradient(transparent 54%,rgba(255,193,7,.42) 54%);font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:.01em}
/* 英語物語 UI修正 2026-08-21 */
html,body{width:100%;max-width:100%;overflow-x:hidden!important;font-size:14px!important}
body{line-height:1.45}.content,.layout,.panel{min-width:0;max-width:100%}
.content{padding:16px!important;overflow-x:hidden!important}.panel{padding:20px!important}h1{font-size:1.35rem!important;margin-bottom:18px!important}h2{font-size:1rem!important}
.topbar{height:54px!important}.topbar b{font-size:1rem!important}.sidebar{width:210px!important}.navitem{padding:11px 14px!important;font-size:.92rem!important}
label,.fields label{font-size:.76rem!important}input,select,textarea,button{font-size:.88rem}.character-pick{min-height:72px!important}.character-image{width:52px!important;height:52px!important}
/* 選択画面を通常図鑑と同じ縦積み・全幅表示にする */
.overlay{display:grid!important;place-items:center!important;padding:3vh 3vw!important;overflow:hidden!important}
.picker-panel{position:relative!important;inset:auto!important;transform:none!important;width:min(1120px,94vw)!important;height:94vh!important;max-height:94vh!important;margin:0!important;padding:20px 24px!important;overflow-y:auto!important;overflow-x:hidden!important;border-radius:16px!important}
.picker-panel h2{font-size:1.35rem!important;margin:0 54px 16px 0!important}.picker-panel>input{margin-bottom:14px!important}
#pickerBox,.picker-tree{display:block!important;width:100%!important;max-width:100%!important}
#pickerBox>.zk-l1,.picker-tree>.zk-l1,.picker-tree>.picker-group{display:block!important;width:100%!important;max-width:100%!important;margin:8px 0!important}
#pickerBox .zk-b1,#pickerBox .zk-b2,#pickerBox .zk-b3,.picker-tree summary{display:flex!important;width:100%!important;max-width:100%!important;min-width:0!important;white-space:normal!important;text-align:left!important}
#pickerBox .zk-body,#pickerBox .picker-subgroup,#pickerBox .picker-category,.picker-tree .zk-body{display:none;width:100%!important;max-width:100%!important}.picker-tree details[open]>.picker-subgroup,.picker-tree details[open]>.picker-category,#pickerBox .zk-body.open{display:block!important}
#pickerBox .zk-grid,#pickerBox .picker-cards,.picker-tree .zk-grid,.picker-tree .picker-cards{width:100%!important;display:grid!important;grid-template-columns:repeat(auto-fill,minmax(72px,1fr))!important;gap:7px!important}
#pickerBox .zk-card,.picker-tree .zk-card{width:100%!important;min-width:0!important}.zk-b1,.zk-b2,.zk-b3{font-size:.88rem!important;padding:8px 11px!important}.zk-card img{width:54px!important;height:54px!important}.zk-card small{font-size:.56rem!important}
/* 詳細画面を常に画面中央へ */
.detail-overlay,.modalx#detail{display:flex!important;align-items:center!important;justify-content:center!important;gap:12px!important;padding:16px!important;overflow:hidden!important}
.detail-overlay[hidden],.modalx#detail[hidden]{display:none!important}
.detail-panel,#detail .modalpanel{position:relative!important;inset:auto!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;transform:none!important;float:none!important;width:min(610px,calc(100vw - 150px))!important;max-width:610px!important;max-height:88vh!important;margin:0!important;overflow-y:auto!important;overflow-x:hidden!important;padding:28px!important;border-radius:22px!important}
.detail-nav{position:relative!important;inset:auto!important;transform:none!important;width:58px!important;height:82px!important;flex:0 0 58px!important;font-size:2.8rem!important}.detail-hero{gap:18px!important;margin-bottom:18px!important}.detail-image-frame{width:126px!important;height:126px!important}.detail-hero h2{font-size:1.42rem!important}.detail-hero p{font-size:.98rem!important}.detail-stat{padding:11px 13px!important;font-size:.88rem!important}.detail-skill{margin-top:18px!important;padding:15px 17px!important}.detail-skill p{font-size:.92rem!important;line-height:1.6!important}.detail-actions button{font-size:.82rem!important;padding:8px 10px!important}
.damage-range{font-size:1.65rem!important}.damage-meta,.kill-result,.ghost{font-size:.86rem!important}
@media(max-width:800px){html,body{font-size:13px!important}.content{padding:9px!important}.panel{padding:12px!important}.picker-panel{width:96vw!important;padding:16px!important}.detail-panel,#detail .modalpanel{width:calc(100vw - 82px)!important;padding:18px 14px!important;max-height:92vh!important}.detail-nav{width:34px!important;height:54px!important;flex-basis:34px!important;font-size:1.8rem!important}.detail-image-frame{width:84px!important;height:84px!important}.detail-hero h2{font-size:1.1rem!important}}
</style></head><body>
<header class="topbar"><button id="menuToggle" class="hamburger" aria-label="メニュー開閉"><i></i><i></i><i></i></button><b>英語物語 対戦ツール</b></header>
<div class="shell"><aside id="sidebar" class="sidebar open"><button data-page="calculator" class="active">計算機</button><button data-page="zukan">図鑑</button><button data-page="tier">Tier表</button><button data-page="opinion">意見箱</button></aside><main>
<section id="page-calculator" class="page active"><div class="panel"><h1>ダメージ計算機</h1><div class="battle">
<article class="fighter attacker"><h2>攻撃キャラ</h2><button id="attackerPicker" class="pick"><span class="portrait"></span><span><strong>未選択</strong><small>タップして図鑑から選択</small></span></button><div class="fields"><label>Power<input id="attackerPower" type="number" value="0"></label><label>属性<select id="attackerAttribute"></select></label><label>解答速度<select id="answerSpeed"><option value="1.2">Excellent（×1.2）</option><option value="1">Correct（×1.0）</option></select></label><label>自力モード<select id="selfMode"><option value="1.2">あり（×1.2）</option><option value="1">なし（×1.0）</option></select></label><label>イベント補正<select id="attackerEvent"><option value="1">なし（×1.0）</option><option value="1.5">あり（×1.5）</option></select></label><label>問題レベル<select id="questionLevel"><option value="1.45">小学生</option><option value="1.5">中1</option><option value="1.55">中2</option><option value="1.6">中3</option><option value="1.65">高1</option><option value="1.7">高2</option><option value="1.75">高3</option><option value="1.8" selected>難関（×1.8）</option></select></label></div><div class="skill"><div><b>ゆるスキル</b><p id="attackerSkill">キャラ未選択</p><small id="attackerEffect"></small></div><button id="attackerSkillBtn" disabled>スキル使用</button></div></article>
<article class="fighter defender"><h2>攻撃対象キャラ</h2><button id="defenderPicker" class="pick"><span class="portrait"></span><span><strong>未選択</strong><small>タップして図鑑から選択</small></span></button><div class="fields"><label>HP<input id="defenderHp" type="number" value="0"></label><label>属性<select id="defenderAttribute"></select></label><label>イベント補正<select id="defenderEvent"><option value="1">なし（×1.0）</option><option value="1.5">あり（×1.5）</option></select></label><label>追加軽減率（%）<input id="cutRates" placeholder="例: 30,20"></label></div><div class="skill"><div><b>ゆるスキル</b><p id="defenderSkill">キャラ未選択</p><small id="defenderEffect"></small></div><button id="defenderSkillBtn" disabled>スキル使用</button></div></article></div>
<button id="swap" class="swap">⇄ 攻守を入れ替え</button><div class="result"><small>予想ダメージ</small><div id="damageRange">0 ～ 0 ダメージ（基準 0）</div><p>属性相性 <b id="attributeRate">1</b>　1発あたり <b id="damagePercent">0%～0%（基準0%）</b></p><p id="killResult">数値を入力してください</p></div><div class="ghost"><h2>幽霊攻撃への耐久</h2><div id="ghostResult">攻撃対象のHPを入力してください</div></div></div></section>
<section id="page-zukan" class="page"><div class="panel"><h1>キャラ図鑑</h1><div class="toolbar"><input id="zkSearch" placeholder="キャラ名で検索"><span id="zkCount"></span></div><div id="zkStatus">読み込み中...</div><div id="zkBox"></div></div></section>
<section id="page-tier" class="page"><div class="panel"><h1>Tier表</h1><div class="tier-controls"><label>モード<select id="mode"><option>ランクアップ率</option><option>使用者数</option></select></label><label>属性縛り<select id="attribute"><option value="">指定なし</option></select></label><label>コスト帯<select id="cost"><option value="">指定なし</option><option>低</option><option>中</option><option>高</option><option>超高</option></select></label><label>枠<select id="waku"><option value="">指定なし</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>補正<select id="hosei"><option value="0">含まない</option><option value="">含む</option><option value="1">補正のみ</option></select></label><label>信頼度<select id="minCount"><option value="5">低</option><option value="10" selected>中</option><option value="20">高</option></select></label></div><button id="tierBtn" class="primary">Tierを生成・表示</button><div id="tierResult"></div></div></section>
<section id="page-opinion" class="page"><div class="panel opinion"><h1>意見箱</h1><p>匿名で送信されます</p><textarea id="opinionText" rows="7"></textarea><button id="opinionSubmit" class="primary">送信</button><p id="opinionMsg"></p></div></section></main></div>
<div id="picker" class="overlay" hidden><div class="modal picker-modal"><button class="close" data-close="picker">×</button><h2 id="pickerTitle">キャラを選択</h2><input id="pickerSearch" placeholder="キャラ名で検索"><div id="pickerBox" class="cards"></div></div></div>
<div id="detail" class="overlay detail-overlay" hidden><button id="detailPrev" class="detail-nav detail-prev" type="button" aria-label="前のキャラ">‹</button><div class="modal detail-modal"><button class="close" data-close="detail">×</button><div class="detail-head"><img id="detailImage" alt=""><div><h2 id="detailName"></h2><p id="detailMeta"></p></div></div><div id="detailStats" class="stats"></div><div class="skill-detail"><b>ゆるスキル</b><span id="detailTurn"></span><p id="detailSkill"></p></div><div id="detailActions" class="actions"><button data-role="attacker">攻撃キャラに設定</button><button data-role="defender">攻撃対象に設定</button><button data-role="picker">選択する</button></div></div><button id="detailNext" class="detail-nav detail-next" type="button" aria-label="次のキャラ">›</button></div>
<script>const $=id=>document.getElementById(id),ATTRS=['火','水','風','火水','水風','火風','全'];
const MATCH={'火':{'火':2/3,'水':1/3,'風':1,'火水':1/2,'水風':2/3,'火風':5/6,'全':2/3},'水':{'火':1,'水':2/3,'風':1/3,'火水':5/6,'水風':1/2,'火風':2/3,'全':2/3},'風':{'火':1/3,'水':1,'風':2/3,'火水':2/3,'水風':5/6,'火風':1/2,'全':2/3},'火水':{'火':5/6,'水':1/2,'風':2/3,'火水':2/3,'水風':7/12,'火風':3/4,'全':2/3},'水風':{'火':2/3,'水':5/6,'風':1/2,'火水':3/4,'水風':2/3,'火風':7/12,'全':2/3},'火風':{'火':1/2,'水':2/3,'風':5/6,'火水':7/12,'水風':3/4,'火風':2/3,'全':2/3},'全':{'火':2/3,'水':2/3,'風':2/3,'火水':2/3,'水風':2/3,'火風':2/3,'全':2/3}};
let chars=[],tierData=null,current=-1,detailOrder=[],pickerRole=null,fromPicker=false,lastDirection=1,selected={attacker:null,defender:null},skillEnabled={attacker:false,defender:false};
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
addEventListener('DOMContentLoaded',()=>{ATTRS.forEach(a=>{$('attackerAttribute').add(new Option(a,a));$('defenderAttribute').add(new Option(a,a))});bind();loadData();calculate()});
function bind(){$('menuToggle').onclick=()=>$('sidebar').classList.toggle('open');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>showPage(b.dataset.page));$('attackerPicker').onclick=()=>openPicker('attacker');$('defenderPicker').onclick=()=>openPicker('defender');$('zkSearch').oninput=renderZukan;$('pickerSearch').oninput=renderPicker;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).hidden=true);document.querySelectorAll('#detailActions button').forEach(b=>b.onclick=()=>choose(b.dataset.role));$('detailPrev').onclick=()=>move(-1);$('detailNext').onclick=()=>move(1);$('swap').onclick=swap;$('attackerSkillBtn').onclick=()=>toggleSkill('attacker');$('defenderSkillBtn').onclick=()=>toggleSkill('defender');['attackerPower','defenderHp','attackerAttribute','defenderAttribute','answerSpeed','selfMode','attackerEvent','defenderEvent','questionLevel','cutRates'].forEach(id=>$(id).oninput=calculate);$('tierBtn').onclick=execTier;$('opinionSubmit').onclick=submitOpinion;document.addEventListener('keydown',e=>{if($('detail').hidden)return;if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;let k=e.key.toLowerCase();if(k==='a'||k==='j'||e.key==='ArrowLeft'){e.preventDefault();move(-1)}else if(k==='d'||k==='k'||e.key==='ArrowRight'){e.preventDefault();move(1)}else if(e.key==='Enter'||e.key===' '){e.preventDefault();move(lastDirection)}})}
function showPage(name){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id==='page-'+name));document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===name))}
async function loadData(){try{let raw=await fetch('zukan_beta.json',{cache:'no-store'}).then(r=>r.json());chars=Array.isArray(raw)?raw:(raw.characters||[]);$('zkStatus').textContent='';renderZukan()}catch(e){$('zkStatus').textContent='図鑑データを読み込めません'}try{tierData=await fetch('tier_all_patterns.json',{cache:'no-store'}).then(r=>r.json());Object.entries(tierData.meta.shibari).forEach(([id,n])=>$('attribute').add(new Option(n,id)))}catch(e){}}
function results(q=''){q=q.trim().toLowerCase();return chars.map((c,i)=>({c,i})).filter(x=>!q||String(x.c.name||'').toLowerCase().includes(q))}
function renderTree(items,box,opened){let tree={};items.forEach(x=>{let c=x.c,a=c.largeCategory||'未分類',b=c.middleCategory||'その他',s=c.smallCategory||'その他',h=c.heading||'';((((tree[a]??={})[b]??={})[s]??={})[h]??=[]).push(x)});box.innerHTML='';Object.entries(tree).forEach(([a,m])=>{let A=folder(a,'zk-b1 '+(a==='特殊ゆる'?'special':'normal'),opened),ab=A.lastChild;Object.entries(m).forEach(([b,sm])=>{let B=folder(b,'zk-b2',opened),bb=B.lastChild;Object.entries(sm).forEach(([s,hm])=>{let S=folder(s,'zk-b3',opened),sb=S.lastChild;Object.entries(hm).forEach(([h,list])=>{if(h){let head=document.createElement('div');head.className='zk-head';head.textContent=h;sb.append(head)}let grid=document.createElement('div');grid.className='zk-grid';list.forEach(x=>grid.append(characterCard(x.c,x.i,opened)));sb.append(grid)});bb.append(S)});ab.append(B)});box.append(A)})}
function folder(name,cls,opened){let wrap=document.createElement('div'),button=document.createElement('button'),body=document.createElement('div');wrap.className='zk-l1';button.className=cls;button.innerHTML=escapeHtml(name)+'<span>▶</span>';body.className='zk-body'+(opened?' open':'');button.onclick=()=>body.classList.toggle('open');wrap.append(button,body);return wrap}
function characterCard(c,i,p){let b=document.createElement('button');b.className='zk-card';b.innerHTML='<img loading="lazy" src="'+escapeHtml(c.imageUrl||'')+'"><small>'+escapeHtml(c.name||'')+'</small>';b.onclick=()=>openDetail(i,p);return b}
function renderZukan(){let r=results($('zkSearch').value);$('zkCount').textContent=r.length+'件 / 全'+chars.length+'体';renderTree(r,$('zkBox'),false)}function openPicker(role){pickerRole=role;$('pickerTitle').textContent=(role==='attacker'?'攻撃キャラ':'攻撃対象キャラ')+'を選択';$('pickerSearch').value='';renderPicker();$('picker').hidden=false}function renderPicker(){renderTree(results($('pickerSearch').value),$('pickerBox'),true)}
function theme(attr){let c={火:['#e53935','#ffe7e5'],水:['#1976d2','#e3f0ff'],風:['#7cbf19','#edf8d8']},f=['火','水','風'].filter(x=>String(attr||'').includes(x));return !f.length?['#6c757d','#6c757d','#f1f3f5']:[c[f[0]][0],f.length>1?'linear-gradient(135deg,'+f.map(x=>c[x][0]).join(',')+')':c[f[0]][0],f.length>1?'linear-gradient(135deg,'+f.map(x=>c[x][1]).join(',')+')':c[f[0]][1]]}
function openDetail(i,p=false){let c=chars[i],d=c?.details||{};if(!c)return;current=i;fromPicker=p;detailOrder=results(p?$('pickerSearch').value:$('zkSearch').value).map(x=>x.i);let [accent,bar,soft]=theme(d.attribute),panel=$('detail').querySelector('.detail-modal');panel.style.setProperty('--accent',accent);panel.style.setProperty('--bar',bar);panel.style.setProperty('--soft',soft);$('detailImage').src=c.imageUrl||'';$('detailName').textContent=c.name||'';$('detailMeta').textContent=[d.rare,d.attribute,d.cost!=null?'Cost '+d.cost:null].filter(Boolean).join(' / ');$('detailStats').innerHTML=[['Cost',d.cost],['最大突破数',d.limitBreak],['無凸HP',d.hp],['無凸Power',d.power],['完凸HP',d.limitHp],['完凸Power',d.limitPower]].filter(x=>x[1]!=null&&x[1]!=='').map(x=>'<div><span>'+x[0]+'</span><b>'+Number(x[1]).toLocaleString()+'</b></div>').join('');$('detailSkill').textContent=d.skill||'';$('detailTurn').textContent=d.skillTurn!=null?'必要ターン '+d.skillTurn:'';document.querySelector('[data-role="attacker"]').hidden=p;document.querySelector('[data-role="defender"]').hidden=p;document.querySelector('[data-role="picker"]').hidden=!p;$('detail').hidden=false}
function move(dir){lastDirection=dir<0?-1:1;let p=detailOrder.indexOf(current);if(p>=0&&detailOrder.length)openDetail(detailOrder[(p+lastDirection+detailOrder.length)%detailOrder.length],fromPicker)}function choose(role){if(role==='picker')role=pickerRole;if(!role||!chars[current])return;setCharacter(role,chars[current]);$('detail').hidden=true;$('picker').hidden=true;showPage('calculator')}
function norm(x){let s=String(x||'');return ATTRS.filter(a=>a!=='全').sort((a,b)=>b.length-a.length).find(a=>s.includes(a))||'全'}function setCharacter(role,c,keep=false){selected[role]=c;if(!keep)skillEnabled[role]=false;let d=c.details||{},p=$(role+'Picker');p.querySelector('.portrait').style.backgroundImage='url("'+String(c.imageUrl||'').replace(/"/g,'')+'")';p.querySelector('strong').textContent=c.name||'';p.querySelector('small').textContent=[d.rare,d.attribute,d.cost!=null?'Cost '+d.cost:null].filter(Boolean).join(' / ');$(role==='attacker'?'attackerPower':'defenderHp').value=Number(role==='attacker'?(d.limitPower??d.power??0):(d.limitHp??d.hp??0));$(role+'Attribute').value=norm(d.attribute);$(role+'Skill').textContent=d.skill||'スキルなし';$(role+'SkillBtn').disabled=!d.skill;syncSkill(role);calculate()}function clearRole(role){selected[role]=null;skillEnabled[role]=false;let p=$(role+'Picker');p.querySelector('.portrait').style.backgroundImage='';p.querySelector('strong').textContent='未選択';p.querySelector('small').textContent='タップして図鑑から選択';$(role==='attacker'?'attackerPower':'defenderHp').value=0;syncSkill(role)}function swap(){let a=selected.attacker,d=selected.defender,as=skillEnabled.attacker,ds=skillEnabled.defender;if(d){skillEnabled.attacker=ds;setCharacter('attacker',d,true)}else clearRole('attacker');if(a){skillEnabled.defender=as;setCharacter('defender',a,true)}else clearRole('defender')}function toggleSkill(r){skillEnabled[r]=!skillEnabled[r];syncSkill(r);calculate()}function syncSkill(r){let b=$(r+'SkillBtn');b.textContent=skillEnabled[r]?'スキル解除':'スキル使用';b.classList.toggle('active',skillEnabled[r])}
function cutMultiplier(s){return String(s||'').split(',').map(Number).filter(Number.isFinite).sort((a,b)=>b-a).reduce((m,x,i)=>m*(1-(x/100)*3/(2*(i+1)+1)),1)}function pct(x,h){return h?Math.floor(x/h*100):0}function fraction(v){for(let [n,s] of [[1,'1'],[1/3,'1/3'],[1/2,'1/2'],[7/12,'7/12'],[2/3,'2/3'],[3/4,'3/4'],[5/6,'5/6']])if(Math.abs(v-n)<1e-9)return s;return String(v)}function calculate(){let p=Math.max(0,+$('attackerPower').value||0),hp=Math.floor(Math.max(0,+$('defenderHp').value||0)*(+$('defenderEvent').value||1)),r=MATCH[$('attackerAttribute').value]?.[$('defenderAttribute').value]??1,base=p*(+$('answerSpeed').value||1)*(+$('selfMode').value||1)*(+$('attackerEvent').value||1)*(+$('questionLevel').value||1)*.75*r*cutMultiplier($('cutRates').value),mn=Math.floor(base*.9),md=Math.floor(base),mx=Math.floor(base*1.1);$('damageRange').textContent=mn.toLocaleString()+'～'+mx.toLocaleString()+' ダメージ（基準 '+md.toLocaleString()+'）';$('attributeRate').textContent=fraction(r);$('damagePercent').textContent=pct(mn,hp)+'%～'+pct(mx,hp)+'%（基準'+pct(md,hp)+'%）';$('killResult').textContent=p&&hp?(mn>=hp?'確定撃破':mx>=hp?'乱数撃破':'撃破不可 / 基準時残りHP '+Math.max(0,hp-md).toLocaleString()):'数値を入力してください';renderGhost(hp)}function renderGhost(h){if(!h){$('ghostResult').textContent='攻撃対象のHPを入力してください';return}let b=1000*1.944*2/3,mn=Math.floor(b*.9),md=Math.floor(b),mx=Math.floor(b*1.1),e=Math.ceil(h/mx),l=Math.ceil(h/mn),s=Math.ceil(h/md);$('ghostResult').innerHTML='<div><b>'+Math.max(0,e-1)+'～'+Math.max(0,l-1)+'発耐える</b><small>基準'+Math.max(0,s-1)+'発</small></div><div><b>'+e+'～'+l+'発目で撃破</b><small>基準'+s+'発目</small></div><div><b>'+pct(mn,h)+'%～'+pct(mx,h)+'%</b><small>基準'+pct(md,h)+'%</small></div>'}
function execTier(){if(!tierData){$('tierResult').textContent='Tierデータを読み込めませんでした';return}let hv=$('hosei').value,key=($('attribute').value||'*')+'|'+($('cost').value||'*')+'|'+($('waku').value||'*')+'|'+(hv===''?'*':hv),bucket=tierData.data[key];if(!bucket){$('tierResult').textContent='該当データなし';return}let mode=$('mode').value,min=+$('minCount').value,a=Object.entries(bucket).map(([id,d])=>({id:+id,count:d[0],rate:d[0]?d[1]/d[0]:0})).filter(x=>x.count>=min).sort((x,y)=>mode==='使用者数'?y.count-x.count:y.rate-x.rate),max=a[0]?.count||0,ths=mode==='使用者数'?[max/2,max/3,max/4,max/5,max/6,max/7,max/8,0]:[.4,.25,.1,0,-.1,-.25,-.4,-Infinity],names=['S','A','B','C','D','E','F','G'],groups=names.map(()=>[]);a.forEach(x=>groups[ths.findIndex(t=>(mode==='使用者数'?x.count:x.rate)>=t)].push(x.id));$('tierResult').innerHTML=groups.map((g,i)=>g.length?'<div class="tier-row"><b>'+names[i]+'</b><div>'+g.map(id=>{let c=chars.find(x=>+x.id===id);return c?'<img data-id="'+id+'" src="'+escapeHtml(c.imageUrl||'')+'">':''}).join('')+'</div></div>':'').join('');$('tierResult').querySelectorAll('[data-id]').forEach(im=>im.onclick=()=>{let i=chars.findIndex(c=>+c.id===+im.dataset.id);if(i>=0){detailOrder=a.map(x=>chars.findIndex(c=>+c.id===x.id)).filter(x=>x>=0);openDetail(i,false)}})}
const OPINION_URL='https://script.google.com/macros/s/AKfycbzb1SZylMA0l61jgM628eMbXeUt7M4tVx-BrrOIK3KpvAWZ_WzJR_cSPsdOMA5EETt8/exec';function submitOpinion(){let t=$('opinionText').value.trim();if(!t){$('opinionMsg').textContent='内容を入力してください';return}fetch(OPINION_URL+'?api=opinion&text='+encodeURIComponent(t),{mode:'no-cors'}).then(()=>{$('opinionText').value='';$('opinionMsg').textContent='送信しました'})}
</script></body></html>
