<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>英語物語 対戦ツール</title><link href="style.css?v=20260821-40" rel="stylesheet"><meta content="20260821-40" name="eigo-ui-build"><style>
.calculator-title{display:grid!important;grid-template-columns:1fr auto 1fr;align-items:center!important;gap:10px}.calculator-title h1{justify-self:start}.calculator-title .swap{justify-self:center;margin:0}.calculator-title .reset-btn{justify-self:end}
.calculator-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}.calculator-layout .battle{min-width:0}.calculator-layout .result{position:sticky;top:70px;min-width:0;padding:22px 14px}.fighter-title{margin-bottom:14px}.fighter-actions{display:flex;gap:8px}.pick{margin-top:2px}
.fields input,.fields select,.progressive-fields input,.tier-controls select{font-size:.76rem!important;font-weight:400;line-height:1.1}.fields label,.progressive-fields label{font-size:.68rem}.ghost #ghostResult{grid-template-columns:repeat(2,minmax(0,1fr))}.preview-modal{width:min(1500px,98vw)!important;max-height:97vh!important}.preview-modal>h2{font-size:1.5rem!important}.preview-modal>img{width:100%!important;height:auto!important}
@media(max-width:800px){.calculator-title{grid-template-columns:minmax(0,1fr) auto auto!important;gap:5px}.calculator-title h1{grid-column:1;grid-row:1;margin:0;font-size:1.03rem;white-space:nowrap}.calculator-title .swap{grid-column:2;grid-row:1;margin:0;padding:6px;font-size:.66rem;white-space:nowrap}.calculator-title .reset-btn{grid-column:3;grid-row:1;margin:0;padding:6px;font-size:.66rem;white-space:nowrap}.calculator-layout{grid-template-columns:1fr;gap:18px}.calculator-layout .result{position:static}.battle{gap:18px!important}.fighter-actions{flex-direction:row!important;gap:8px!important}.mini-reset{flex:1;min-height:40px;padding:7px!important;font-size:.7rem!important;white-space:nowrap}.fields input,.fields select,.progressive-fields input,.tier-controls select,.toolbar input,.picker-modal>input{font-size:16px!important;line-height:1!important;transform:scale(.84);transform-origin:left center;width:119.05%!important}.fields label,.progressive-fields label{overflow:hidden}.preview-modal{width:98vw!important;max-width:98vw!important;padding:62px 10px 16px!important;overflow:auto!important}.preview-modal>h2{font-size:1.5rem!important}.preview-modal>img{width:auto!important;min-width:1000px!important;max-width:none!important}.ghost #ghostResult{grid-template-columns:1fr!important}}
</style></head><body>
<header class="topbar"><button class="hamburger" id="menuToggle"><i></i><i></i><i></i></button><b>英語物語 対戦ツール</b></header>
<aside class="sidebar" id="sidebar"><button class="active" data-page="calculator">計算機</button><button data-page="zukan">図鑑</button><button data-page="tier">Tier表</button></aside><main>
<section class="page active" id="page-calculator"><div class="panel"><div class="calculator-title"><h1>ダメージ計算機</h1><button class="swap" id="swap" type="button">⇄ 攻守を入れ替え</button><button class="reset-btn" id="resetAll" type="button">全リセット</button></div><div class="calculator-layout"><div class="battle">
<article class="fighter attacker"><div class="fighter-title"><h2>攻撃キャラ</h2><div class="fighter-actions"><button class="mini-reset" id="attackerResetExceptCharacter" type="button">キャラ以外リセット</button><button class="mini-reset danger" id="attackerRemoveCharacter" type="button">キャラ削除</button></div></div><button class="pick" id="attackerPicker"><span class="portrait"></span><span><strong>未選択</strong><small>タップして図鑑から選択</small></span></button><div class="fields"><label>Power<input id="attackerPower" type="number" value="0"></label><label>属性<select id="attackerAttribute"></select></label><label>イベント補正<select id="attackerEvent"><option value="1">なし（×1.0）</option><option value="1.5">あり（×1.5）</option></select></label><label>解答速度<select id="answerSpeed"><option value="1.2">Excellent（×1.2）</option><option value="1">Correct（×1.0）</option></select></label><label>自力モード<select id="selfMode"><option value="1.2">あり（×1.2）</option><option value="1">なし（×1.0）</option></select></label><label>問題レベル<select id="questionLevel"><option value="1.45">小学生（×1.45）</option><option value="1.5">中1（×1.5）</option><option value="1.55">中2（×1.55）</option><option value="1.6">中3（×1.6）</option><option value="1.65">高1（×1.65）</option><option value="1.7">高2（×1.7）</option><option value="1.75">高3（×1.75）</option><option selected value="1.8">難関（×1.8）</option></select></label><label>生存補正（ターン数）<select id="survivalTurns"></select></label><div class="progressive-fields inline-progressive" id="attackBuffFields"></div><label>追加連撃（回）<input id="additionalHits" min="0" step="1" type="number" value="0"></label><label>攻撃倍率（×）<input id="attackMultiplier" min="0" step="any" type="number" value="1"></label></div><div class="skill"><div><b>ゆるスキル</b><p id="attackerSkill">キャラ未選択</p><small id="attackerEffect"></small></div><button disabled id="attackerSkillBtn">スキル使用</button></div></article>
<article class="fighter defender"><div class="fighter-title"><h2>攻撃対象キャラ</h2><div class="fighter-actions"><button class="mini-reset" id="defenderResetExceptCharacter" type="button">キャラ以外リセット</button><button class="mini-reset danger" id="defenderRemoveCharacter" type="button">キャラ削除</button></div></div><button class="pick" id="defenderPicker"><span class="portrait"></span><span><strong>未選択</strong><small>タップして図鑑から選択</small></span></button><div class="fields"><label>HP<input id="defenderHp" type="number" value="0"></label><label>属性<select id="defenderAttribute"></select></label><label>イベント補正<select id="defenderEvent"><option value="1">なし（×1.0）</option><option value="1.5">あり（×1.5）</option></select></label></div><div class="progressive-fields" id="cutRateFields"></div><div class="skill"><div><b>ゆるスキル</b><p id="defenderSkill">キャラ未選択</p><small id="defenderEffect"></small></div><button disabled id="defenderSkillBtn">スキル使用</button></div><div class="ghost"><h2>幽霊攻撃への耐久（攻撃対象キャラ）</h2><div id="ghostResult">攻撃対象のHPを入力してください</div></div></article></div>
<div class="result"><small>予想ダメージ</small><strong id="killResult">数値を入力してください</strong><div id="damageRange">0～0（0%～0%）</div><button class="download" id="downloadResult">結果を画像で保存</button></div></div></div></section>
<section class="page" id="page-zukan"><div class="panel"><h1>キャラ図鑑</h1><div class="toolbar"><input id="zkSearch" placeholder="キャラ名で検索"><span id="zkCount"></span></div><div id="zkStatus">読み込み中...</div><div id="zkBox"></div></div></section>
<section class="page" id="page-tier"><div class="panel"><h1>Tier表</h1><div class="tier-controls"><label>モード<select id="mode"><option>ランクアップ率</option><option>使用者数</option></select></label><label>属性縛り<select id="attribute"><option value="">指定なし</option></select></label><label>コスト帯<select id="cost"><option value="">指定なし</option><option>低</option><option>中</option><option>高</option><option>超高</option></select></label><label>枠<select id="waku"><option value="">指定なし</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>補正<select id="hosei"><option value="0">含まない</option><option value="">含む</option><option value="1">補正のみ</option></select></label><label>信頼度<select id="minCount"><option value="5">低</option><option selected value="10">中</option><option value="20">高</option></select></label></div><button class="primary" id="tierBtn">Tierを生成・表示</button><div id="tierResult"></div></div></section></main>
<div class="overlay" hidden id="picker"><div class="modal picker-modal"><button class="close" data-close="picker">×</button><h2 id="pickerTitle">キャラを選択</h2><input id="pickerSearch" placeholder="キャラ名で検索"><div id="pickerBox"></div></div></div>
<div class="overlay detail-overlay" hidden id="detail"><button class="detail-nav" id="detailPrev">‹</button><div class="modal detail-modal"><button class="close detail-close" data-close="detail">×</button><div class="detail-head"><img id="detailImage"><div><h2 id="detailName"></h2><p id="detailMeta"></p></div></div><div class="stats" id="detailStats"></div><div class="skill-detail"><b>ゆるスキル</b><span id="detailTurn"></span><p id="detailSkill"></p></div><div class="actions" id="detailActions"><button data-role="attacker">攻撃キャラに設定</button><button data-role="defender">攻撃対象に設定</button><button data-role="picker">選択する</button></div></div><button class="detail-nav" id="detailNext">›</button></div>
<script src="app.js?v=20260821-40"></script><script>
addEventListener('DOMContentLoaded',()=>{
 const baseCalculate=calculate,hits=$('additionalHits'),multiplier=$('attackMultiplier');
 calculate=function(){
  baseCalculate();
  const extra=Math.max(0,Math.floor(Number(hits.value)||0)),scale=Math.max(0,Number(multiplier.value)||0);
  if(lastResult?.eh&&(extra||scale!==1)){
   const baseHits=Math.max(1,lastResult.s.hits),totalHits=baseHits+extra;
   const mn=Math.floor(lastResult.mn/baseHits*totalHits*scale),mx=Math.floor(lastResult.mx/baseHits*totalHits*scale);
   const mp=Math.floor(mn/lastResult.eh*100),xp=Math.floor(mx/lastResult.eh*100),st=mn>=lastResult.eh?'確定撃破':mx>=lastResult.eh?'乱数撃破':'撃破不可';
   $('killResult').textContent=st;$('damageRange').textContent=`${mn.toLocaleString()}～${mx.toLocaleString()}（${mp}%～${xp}%）`;lastResult={...lastResult,st,mn,mx,mp,xp};
  }
 };
 hits.oninput=calculate;multiplier.oninput=calculate;
 const baseReset=resetExceptCharacter;
 resetExceptCharacter=function(role){baseReset(role);if(role==='attacker'){hits.value='0';multiplier.value='1'}calculate()};
 const baseResetAll=resetAll;
 resetAll=function(){hits.value='0';multiplier.value='1';baseResetAll()};
 const baseDrawSide=drawSide;
 drawSide=function(x,title,c,role,img,left,top){baseDrawSide(x,title,c,role,img,left,top);if(role==='attacker'){x.save();x.fillStyle='#222';x.font='18px sans-serif';x.textAlign='left';x.fillText(`追加連撃: ${hits.value||0}回 / 攻撃倍率: ×${multiplier.value||1}`,left+28,top+720);x.restore()}};
 const baseCard=card;
 card=function(c,i,p){const button=baseCard(c,i,p);button.dataset.charIndex=String(i);button.onclick=()=>{const box=button.closest('#pickerBox,#zkBox'),order=box?[...box.querySelectorAll('.zk-card[data-char-index]')].map(x=>Number(x.dataset.charIndex)):null;openDetail(i,p,order&&order.length?order:null)};return button};
 renderGhost=function(h){if(!h){$('ghostResult').textContent='攻撃対象のHPを入力してください';ghostData=null;return}const b=1296,mn=Math.floor(b*.9),mx=Math.floor(b*1.1),first=Math.ceil(h/mx),last=Math.ceil(h/mn);ghostData={survive:`${Math.max(0,first-1)}～${Math.max(0,last-1)}発耐え`,kill:`${first}～${last}発目で撃破される`};$('ghostResult').innerHTML=`<div><b>${ghostData.survive}</b></div><div><b>${ghostData.kill}</b></div>`};
 calculate();
});
</script></body></html>
