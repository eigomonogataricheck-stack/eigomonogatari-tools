<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英語物語 対戦ツール</title><link rel="stylesheet" href="style.css"></head><body>
<header class="topbar"><b>英語物語 対戦ツール</b><button id="menuToggle" class="hamburger" aria-label="メニューを開閉" aria-expanded="true"><span></span><span></span><span></span></button></header><div class="layout"><aside id="sidebar" class="sidebar open"><nav><button class="navitem active" data-page="calculator">計算機</button><button class="navitem" data-page="zukan">図鑑</button><button class="navitem" data-page="tier">Tier表</button><button class="navitem" data-page="opinion">意見箱</button></nav></aside><main class="content">
<section id="page-calculator" class="page active"><div class="panel"><h1>ダメージ計算機</h1><div class="battle-grid"><article class="fighter attack"><h2>攻撃キャラ</h2><button id="attackerPicker" class="character-pick"><span class="character-image"></span><span><strong>未選択</strong><small>タップして図鑑から選択</small></span></button><div class="fields"><label>Power<input id="attackerPower" type="number" min="0" value="0"></label><label>属性<select id="attackerAttribute"></select></label><label>解答速度<select id="answerSpeed"><option value="1.2">Excellent（×1.2）</option><option value="1">Correct（×1.0）</option></select></label><label>自力モード<select id="selfMode"><option value="1.2">あり（×1.2）</option><option value="1">なし（×1.0）</option></select></label><label>イベント補正<select id="attackerEvent"><option value="1">なし（×1.0）</option><option value="1.5">あり（×1.5）</option></select></label><label>問題レベル<select id="questionLevel"><option value="1.45">小学生（×1.45）</option><option value="1.5">中1（×1.5）</option><option value="1.55">中2（×1.55）</option><option value="1.6">中3（×1.6）</option><option value="1.65">高1（×1.65）</option><option value="1.7">高2（×1.7）</option><option value="1.75">高3（×1.75）</option><option value="1.8" selected>難関（×1.8）</option></select></label></div><div class="skill-box"><div><b>ゆるスキル</b><p id="attackerSkill">キャラ未選択</p><small id="attackerEffect"></small></div><button id="attackerSkillBtn" disabled>スキル使用</button></div></article>
<article class="fighter defend"><h2>攻撃対象キャラ</h2><button id="defenderPicker" class="character-pick"><span class="character-image"></span><span><strong>未選択</strong><small>タップして図鑑から選択</small></span></button><div class="fields"><label>HP<input id="defenderHp" type="number" min="0" value="0"></label><label>属性<select id="defenderAttribute"></select></label><label>イベント補正<select id="defenderEvent"><option value="1">なし（×1.0）</option><option value="1.5">あり（×1.5）</option></select></label><label>追加軽減率（%、カンマ区切り）<input id="cutRates" placeholder="例: 30,20"></label></div><div class="skill-box"><div><b>ゆるスキル</b><p id="defenderSkill">キャラ未選択</p><small id="defenderEffect"></small></div><button id="defenderSkillBtn" disabled>スキル使用</button></div></article></div><button id="swap" class="swap">⇄ 攻守を入れ替え</button><section class="damage-card"><p>予想ダメージ</p><div id="damageRange" class="damage-range">0 ～ 0 ダメージ <span>（基準 0）</span></div><div class="damage-meta"><span>属性相性 <b id="attributeRate">1</b></span><span>1発あたり <b id="damagePercent">0%～0%（基準0%）</b></span></div><div id="killResult" class="kill-result">数値を入力してください</div></section><section class="ghost"><h2>幽霊攻撃への耐久</h2><div id="ghostResult">攻撃対象のHPを入力してください</div></section></div></section>
<section id="page-zukan" class="page"><div class="panel"><h1>キャラ図鑑</h1><div class="zukan-controls"><input id="zkSearch" placeholder="キャラ名で検索"><span id="zkCount"></span><button id="toggleAll">全て開く／閉じる</button></div><div id="zkStatus">読み込み中...</div><div id="zkBox"></div></div></section>
<section id="page-tier" class="page"><div class="panel"><h1>Tier表</h1><div class="tier-controls"><label>モード<select id="mode"><option>ランクアップ率</option><option>使用者数</option></select></label><label>属性縛り<select id="attribute"><option value="">指定なし</option></select></label><label>コスト帯<select id="cost"><option value="">指定なし</option><option>低</option><option>中</option><option>高</option><option>超高</option></select></label><label>枠<select id="waku"><option value="">指定なし</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>補正<select id="hosei"><option value="0">含まない</option><option value="">含む</option><option value="1">補正のみ</option></select></label><label>信頼度<select id="minCount"><option value="5">低</option><option value="10" selected>中</option><option value="20">高</option></select></label></div><button id="tierBtn" class="primary">Tierを生成・表示</button><div id="tierResult"></div></div></section><section id="page-opinion" class="page"><div class="panel opinion"><h1>意見箱</h1><p>匿名で送信されます</p><textarea id="opinionText" rows="7" placeholder="要望・不具合・感想など"></textarea><button id="opinionSubmit" class="primary">送信</button><p id="opinionMsg"></p></div></section></main></div>
<div id="picker" class="overlay" hidden><div class="picker-panel"><button class="close" data-close="picker">×</button><h2 id="pickerTitle">キャラを選択</h2><input id="pickerSearch" placeholder="キャラ名で検索"><div id="pickerBox"></div></div></div><div id="detail" class="detail-overlay" hidden><button id="detailPrev" class="detail-nav prev">‹</button><article id="detailPanel" class="detail-panel"><button class="close" data-close="detail">×</button><div class="detail-hero"><div class="detail-image-frame"><img id="detailImage" alt=""></div><div><h2 id="detailName"></h2><p id="detailMeta"></p></div></div><div id="detailStats" class="detail-stats"></div><section id="detailSkillBlock" class="detail-skill"><header><b>ゆるスキル</b><span id="detailTurn"></span></header><p id="detailSkill"></p></section><div id="detailActions" class="detail-actions"><button data-role="attacker">攻撃キャラに設定</button><button data-role="defender">攻撃対象に設定</button><button data-role="picker">選択する</button></div></article><button id="detailNext" class="detail-nav next">›</button></div><script src="app.js"></script></body></html>
