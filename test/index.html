<script>const $=id=>document.getElementById(id),ATTRS=['火','水','風','火水','水風','火風','全'];

let chars=[],tierData=null,current=-1,detailOrder=[],pickerRole=null,fromPicker=false,lastDirection=1,selected={attacker:null,defender:null},skillEnabled={attacker:false,defender:false};
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function bind(){$('menuToggle').onclick=()=>$('sidebar').classList.toggle('open');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>showPage(b.dataset.page));$('attackerPicker').onclick=()=>openPicker('attacker');$('defenderPicker').onclick=()=>openPicker('defender');$('zkSearch').oninput=renderZukan;$('pickerSearch').oninput=renderPicker;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).hidden=true);document.querySelectorAll('#detailActions button').forEach(b=>b.onclick=()=>choose(b.dataset.role));$('detailPrev').onclick=()=>move(-1);$('detailNext').onclick=()=>move(1);$('swap').onclick=swap;$('attackerSkillBtn').onclick=()=>toggleSkill('attacker');$('defenderSkillBtn').onclick=()=>toggleSkill('defender');['attackerPower','defenderHp','attackerAttribute','defenderAttribute','answerSpeed','selfMode','attackerEvent','defenderEvent','questionLevel','cutRates'].forEach(id=>$(id).oninput=calculate);$('tierBtn').onclick=execTier;$('opinionSubmit').onclick=submitOpinion;document.addEventListener('keydown',e=>{if($('detail').hidden)return;if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;let k=e.key.toLowerCase();if(k==='a'||k==='j'||e.key==='ArrowLeft'){e.preventDefault();move(-1)}else if(k==='d'||k==='k'||e.key==='ArrowRight'){e.preventDefault();move(1)}else if(e.key==='Enter'||e.key===' '){e.preventDefault();move(lastDirection)}})}

async function loadData(){try{let raw=await fetch('zukan_beta.json',{cache:'no-store'}).then(r=>r.json());chars=Array.isArray(raw)?raw:(raw.characters||[]);$('zkStatus').textContent='';renderZukan()}catch(e){$('zkStatus').textContent='図鑑データを読み込めません'}try{tierData=await fetch('tier_all_patterns.json',{cache:'no-store'}).then(r=>r.json());Object.entries(tierData.meta.shibari).forEach(([id,n])=>$('attribute').add(new Option(n,id)))}catch(e){}}

function renderTree(items,box,opened){let tree={};items.forEach(x=>{let c=x.c,a=c.largeCategory||'未分類',b=c.middleCategory||'その他',sm=c.smallCategory||'その他',h=c.heading||'';((((tree[a]??={})[b]??={})[sm]??={})[h]??=[]).push(x)});box.innerHTML='';Object.entries(tree).forEach(([a,m])=>{let A=folder(a,'zk-b1 '+(a==='特殊ゆる'?'special':'normal'),opened),ab=A.lastChild;Object.entries(m).forEach(([b,smalls])=>{let B=folder(b,'zk-b2',opened),bb=B.lastChild;Object.entries(smalls).forEach(([sm,heads])=>{let S=sm==='その他'?null:folder(sm,'zk-b3',opened),sb=S?S.lastChild:bb;Object.entries(heads).forEach(([h,list])=>{if(h&&h!=='その他'){let head=document.createElement('div');head.className='zk-head';head.textContent=h;sb.append(head)}let grid=document.createElement('div');grid.className='zk-grid';list.forEach(x=>grid.append(characterCard(x.c,x.i,opened)));sb.append(grid)});if(S)bb.append(S)});ab.append(B)});box.append(A)})}
function folder(name,cls,opened){let wrap=document.createElement('div'),button=document.createElement('button'),body=document.createElement('div');wrap.className='zk-l1';button.className=cls;button.innerHTML=escapeHtml(name)+'<span>▶</span>';body.className='zk-body'+(opened?' open':'');button.onclick=()=>body.classList.toggle('open');wrap.append(button,body);return wrap}

function renderZukan(){let r=results($('zkSearch').value);$('zkCount').textContent=r.length+'件 / 全'+chars.length+'体';renderTree(r,$('zkBox'),false)}function openPicker(role){pickerRole=role;$('pickerTitle').textContent=(role==='attacker'?'攻撃キャラ':'攻撃対象キャラ')+'を選択';$('pickerSearch').value='';renderPicker();$('picker').hidden=false}function renderPicker(){renderTree(results($('pickerSearch').value),$('pickerBox'),false)}
function theme(attr){let c={火:['#e53935','#ffe7e5'],水:['#1976d2','#e3f0ff'],風:['#7cbf19','#edf8d8']},f=['火','水','風'].filter(x=>String(attr||'').includes(x));return !f.length?['#6c757d','#6c757d','#f1f3f5']:[c[f[0]][0],f.length>1?'linear-gradient(135deg,'+f.map(x=>c[x][0]).join(',')+')':c[f[0]][0],f.length>1?'linear-gradient(135deg,'+f.map(x=>c[x][1]).join(',')+')':c[f[0]][1]]}
